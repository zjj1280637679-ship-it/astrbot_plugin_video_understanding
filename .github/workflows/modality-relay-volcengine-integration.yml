name: Modality Relay + Volcengine Integration

on:
  push:
    branches:
      - feat/modality-relay-v0.2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref:
          - v4.27.4
          - v4.28.0-beta.1
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert no hard Volcengine coupling in Relay runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein 'import[[:space:]].*astrbot_plugin_volcengine_provider|from[[:space:]].*astrbot_plugin_volcengine_provider' main.py policy.py media_binding.py media_state.py media_tools.py relay.py tool.py transport.py; then
            echo 'Relay runtime must not import the Volcengine plugin.'
            exit 1
          fi
      - name: Clone AstrBot
        run: git clone --depth 1 --branch '${{ matrix.astrbot_ref }}' https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
      - name: Install AstrBot
        run: uv sync --directory AstrBot
      - name: Initialize clean AstrBot
        shell: bash
        run: |
          set -euo pipefail
          touch AstrBot/.astrbot
          printf '\n' | uv run --directory AstrBot astrbot init
      - name: Install Volcengine dual-channel plugin
        run: git clone --depth 1 https://github.com/zjj1280637679-ship-it/astrbot_plugin_volcengine_provider.git AstrBot/data/plugins/astrbot_plugin_volcengine_provider
      - name: Install Relay plugin
        shell: bash
        run: |
          set -euo pipefail
          target='AstrBot/data/plugins/astrbot_plugin_video_understanding'
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' --exclude 'tests' ./ "$target"/
      - name: Start combined runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          nohup uv run --directory AstrBot astrbot run --port 6186 >integration-evidence/startup.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 75); do
            if grep -q '\[modality-relay\] loaded' integration-evidence/startup.log; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat integration-evidence/startup.log; exit 1; fi
            sleep 1
          done
          cat integration-evidence/startup.log
          test "$ready" = '1'
          if grep -Eiq 'failed to load plugin.*astrbot_plugin_volcengine_provider|failed to load plugin.*astrbot_plugin_video_understanding' integration-evidence/startup.log; then exit 1; fi
          kill "$pid" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relay-volcengine-${{ matrix.astrbot_ref }}
          path: integration-evidence
          if-no-files-found: error
          retention-days: 7
