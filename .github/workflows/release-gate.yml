name: 0.1.0 Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/query-video-tool-v0.1
    paths:
      - .github/workflows/release-gate.yml
      - main.py
      - tool.py
      - transport.py
      - video_binding.py
      - _conf_schema.json
      - metadata.yaml
      - LICENSE
      - CHANGELOG.md
      - tests/**

permissions:
  contents: read

jobs:
  host-runtime:
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref: [v4.27.3, master]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject provider coupling and fallback creep
        shell: bash
        run: |
          set -euo pipefail
          files=(main.py tool.py transport.py video_binding.py)
          if grep -Ein 'google\.generativeai|from google import genai|volcengine|doubao|minimax|ffmpeg|opencv|pytesseract|whisper' "${files[@]}"; then
            echo 'Thin-plugin boundary violation detected.'
            exit 1
          fi
      - name: Compile all runtime and tests
        run: python -m compileall -q main.py tool.py transport.py video_binding.py tests
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE CHANGELOG.md metadata.yaml _conf_schema.json main.py tool.py transport.py video_binding.py; do
            test -s "$file"
          done
      - name: Clone AstrBot
        run: git clone --depth 1 --branch '${{ matrix.astrbot_ref }}' https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Install exact AstrBot runtime
        run: uv sync --directory AstrBot
      - name: Run unit tests in host environment
        run: uv run --directory AstrBot python -m pytest "$GITHUB_WORKSPACE/tests/test_video_semantic_search.py" -q
      - name: Initialize and install plugin
        shell: bash
        run: |
          set -euo pipefail
          touch AstrBot/.astrbot
          printf '\n' | uv run --directory AstrBot astrbot init
          target='AstrBot/data/plugins/astrbot_plugin_video_understanding'
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' --exclude 'tests' --exclude 'docs' ./ "$target"/
          for file in main.py tool.py transport.py video_binding.py metadata.yaml _conf_schema.json LICENSE; do
            test -s "$target/$file"
          done
      - name: Start AstrBot and prove plugin loads
        shell: bash
        run: |
          set -euo pipefail
          nohup uv run --directory AstrBot astrbot run --port 6185 >release-runtime.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 75); do
            if grep -q '\[video-semantic-search\]' release-runtime.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat release-runtime.log
              exit 1
            fi
            sleep 1
          done
          cat release-runtime.log
          test "$ready" = '1'
          kill "$pid" 2>/dev/null || true
